nameOverride: ""
fullnameOverride: ""
replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: digital-bank-java/transaction-service
  tag: "0.0.3"
  pullPolicy: IfNotPresent

runtime:
  profile: default
  configServerUrl: http://config-server:8888

database:
  secretName: postgres
  usernameKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD

auth:
  secrets:
    enabled: false
    name: auth-service-secrets
    jwtSecretKey: jwt-secret

kafka:
  bootstrapServers: ""
  securityProtocol: SASL_SSL

reservationEvents:
  enabled: false
  sitPlaintextEnabled: false

ledgerEvents:
  enabled: false
  sitPlaintextEnabled: false
  requestedTopic: ledger.posting.requested.v1
  completedTopic: ledger.posting.completed.v1
  failedTopic: ledger.posting.failed.v1

service:
  type: ClusterIP
  port: 8084

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

temporaryStorage:
  sizeLimit: 64Mi

terminationGracePeriodSeconds: 30
