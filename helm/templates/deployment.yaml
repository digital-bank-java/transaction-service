apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transaction-service.fullname" . }}
  labels:
    {{- include "transaction-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "transaction-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "transaction-service.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ include "transaction-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_SERVER_URL
              value: {{ .Values.runtime.configServerUrl | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.runtime.profile | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: {{ .Values.database.usernameKey | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName | quote }}
                  key: {{ .Values.database.passwordKey | quote }}
            {{- if .Values.auth.secrets.enabled }}
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secrets.name | quote }}
                  key: {{ .Values.auth.secrets.jwtSecretKey | quote }}
            {{- end }}
            - name: TRANSACTION_RISK_POLICY_VERSION
              value: {{ .Values.risk.policyVersion | quote }}
            - name: TRANSACTION_RISK_DECISION_TTL
              value: {{ .Values.risk.decisionTtl | quote }}
            - name: TRANSACTION_RISK_HIGH_VALUE_THRESHOLD_AED
              value: {{ .Values.risk.highValueThresholds.AED | quote }}
            - name: TRANSACTION_RISK_HIGH_VALUE_THRESHOLD_USD
              value: {{ .Values.risk.highValueThresholds.USD | quote }}
            - name: TRANSACTION_RISK_STEP_UP_DESTINATION_CLASSES
              value: {{ .Values.risk.stepUpDestinationClasses | quote }}
            - name: TRANSACTION_RISK_DECLINED_DESTINATION_CLASSES
              value: {{ .Values.risk.declinedDestinationClasses | quote }}
            - name: TRANSACTION_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: TRANSACTION_KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafka.securityProtocol | quote }}
            - name: TRANSACTION_EVENTS_RESERVATION_ENABLED
              value: {{ .Values.reservationEvents.enabled | quote }}
            - name: TRANSACTION_EVENTS_RESERVATION_SIT_PLAINTEXT_ENABLED
              value: {{ .Values.reservationEvents.sitPlaintextEnabled | quote }}
            - name: TRANSACTION_EVENTS_LEDGER_ENABLED
              value: {{ .Values.ledgerEvents.enabled | quote }}
            - name: TRANSACTION_EVENTS_LEDGER_SIT_PLAINTEXT_ENABLED
              value: {{ .Values.ledgerEvents.sitPlaintextEnabled | quote }}
            - name: LEDGER_POSTING_REQUESTED_TOPIC
              value: {{ .Values.ledgerEvents.requestedTopic | quote }}
            - name: LEDGER_POSTING_COMPLETED_TOPIC
              value: {{ .Values.ledgerEvents.completedTopic | quote }}
            - name: LEDGER_POSTING_FAILED_TOPIC
              value: {{ .Values.ledgerEvents.failedTopic | quote }}
            - name: TRANSACTION_EVENTS_MFA_ASSURANCE_ENABLED
              value: {{ .Values.mfaAssuranceEvents.enabled | quote }}
            - name: TRANSACTION_EVENTS_MFA_ASSURANCE_SIT_PLAINTEXT_ENABLED
              value: {{ .Values.mfaAssuranceEvents.sitPlaintextEnabled | quote }}
            - name: TRANSACTION_EVENTS_MFA_ASSURANCE_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.mfaAssuranceEvents.bootstrapServers | quote }}
            - name: TRANSACTION_EVENTS_MFA_ASSURANCE_KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.mfaAssuranceEvents.securityProtocol | quote }}
            - name: MFA_ASSURANCE_GRANTED_TOPIC
              value: {{ .Values.mfaAssuranceEvents.topic | quote }}
            - name: MFA_ASSURANCE_CONSUMER_GROUP_ID
              value: {{ .Values.mfaAssuranceEvents.consumerGroupId | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.temporaryStorage.sizeLimit }}
