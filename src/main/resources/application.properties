spring.application.name=transaction-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
transaction.transfer.authorization.allowed-subjects=${TRANSFER_ALLOWED_SUBJECTS:}
transaction.events.transfer-created.enabled=${TRANSFER_EVENTS_TRANSFER_CREATED_ENABLED:false}
transaction.events.transfer-created.topic=${TRANSFER_CREATED_TOPIC:events.transfer.created.v1}
transaction.events.publisher.fixed-delay-ms=${TRANSFER_EVENTS_PUBLISHER_FIXED_DELAY_MS:1000}
