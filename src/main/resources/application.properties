spring.application.name=transaction-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${TRANSACTION_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties[security.protocol]=${TRANSACTION_KAFKA_SECURITY_PROTOCOL:SASL_SSL}
transaction.transfer.authorization.allowed-subjects=${TRANSFER_ALLOWED_SUBJECTS:}
transaction.events.transfer-created.enabled=${TRANSFER_EVENTS_TRANSFER_CREATED_ENABLED:false}
transaction.events.transfer-created.topic=${TRANSFER_CREATED_TOPIC:events.transfer.created.v1}
transaction.events.publisher.fixed-delay-ms=${TRANSFER_EVENTS_PUBLISHER_FIXED_DELAY_MS:1000}
transaction.events.reservation.enabled=${TRANSACTION_EVENTS_RESERVATION_ENABLED:false}
transaction.events.reservation.requested-topic=${ACCOUNT_RESERVATION_REQUESTED_TOPIC:account.reservation.requested.v1}
transaction.events.reservation.release-requested-topic=${ACCOUNT_RESERVATION_RELEASE_REQUESTED_TOPIC:account.reservation.release-requested.v1}
transaction.events.reservation.accepted-topic=${ACCOUNT_RESERVATION_ACCEPTED_TOPIC:account.reservation.accepted.v1}
transaction.events.reservation.rejected-topic=${ACCOUNT_RESERVATION_REJECTED_TOPIC:account.reservation.rejected.v1}
transaction.events.reservation.released-topic=${ACCOUNT_RESERVATION_RELEASED_TOPIC:account.reservation.released.v1}
transaction.events.reservation.expired-topic=${ACCOUNT_RESERVATION_EXPIRED_TOPIC:account.reservation.expired.v1}
transaction.events.reservation.consumer.group-id=${ACCOUNT_RESERVATION_CONSUMER_GROUP_ID:transaction-service-reservation}
transaction.events.reservation.publisher.fixed-delay-ms=${TRANSACTION_EVENTS_RESERVATION_PUBLISHER_FIXED_DELAY_MS:1000}
transaction.events.reservation.publisher.lease-seconds=${TRANSACTION_EVENTS_RESERVATION_PUBLISHER_LEASE_SECONDS:900}
transaction.events.reservation.publisher.send-timeout-seconds=${TRANSACTION_EVENTS_RESERVATION_PUBLISHER_SEND_TIMEOUT_SECONDS:10}
transaction.events.reservation.publisher.retry-delay-ms=${TRANSACTION_EVENTS_RESERVATION_PUBLISHER_RETRY_DELAY_MS:5000}
transaction.events.reservation.consumer.retry.max-attempts=${TRANSACTION_EVENTS_RESERVATION_CONSUMER_RETRY_MAX_ATTEMPTS:3}
transaction.events.reservation.consumer.retry.initial-interval-ms=${TRANSACTION_EVENTS_RESERVATION_CONSUMER_RETRY_INITIAL_INTERVAL_MS:1000}
transaction.events.reservation.consumer.retry.multiplier=${TRANSACTION_EVENTS_RESERVATION_CONSUMER_RETRY_MULTIPLIER:2.0}
transaction.events.reservation.consumer.retry.max-interval-ms=${TRANSACTION_EVENTS_RESERVATION_CONSUMER_RETRY_MAX_INTERVAL_MS:10000}
transaction.events.reservation.kafka.bootstrap-servers=${TRANSACTION_EVENTS_RESERVATION_KAFKA_BOOTSTRAP_SERVERS:}
transaction.events.reservation.security.protocol=${TRANSACTION_EVENTS_RESERVATION_KAFKA_SECURITY_PROTOCOL:}
transaction.events.reservation.sit-plaintext-enabled=${TRANSACTION_EVENTS_RESERVATION_SIT_PLAINTEXT_ENABLED:false}
