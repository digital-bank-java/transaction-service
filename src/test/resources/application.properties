spring.application.name=transaction-service
spring.cloud.config.enabled=false
spring.datasource.url=jdbc:h2:mem:transaction-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
transaction.transfer.authorization.allowed-subjects=transfer-orchestrator
transaction.events.transfer-created.enabled=false
transaction.events.reservation.enabled=false
